<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - PY-AUTO-BLOG</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white min-h-screen p-6">
            <h1 class="text-xl font-black mb-8">ADMIN PANEL</h1>
            <nav class="space-y-4">
                <a href="/admin/" class="block text-blue-400 font-bold">Dashboard</a>
                <a href="https://monetag.com/publishers/" target="_blank" class="block hover:text-blue-400">Monetag Analytics</a>
                <a href="/" class="block hover:text-blue-400">View Site</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold">Dashboard</h2>
                <div class="bg-white px-4 py-2 rounded shadow-sm text-sm text-gray-500">
                    Logged in as Administrator
                </div>
            </div>

            <!-- Stats Overview -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="text-gray-500 text-sm mb-2">Total Articles</div>
                    <div class="text-3xl font-bold" id="total-articles">-</div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="text-gray-500 text-sm mb-2">Total Views (Est.)</div>
                    <div class="text-3xl font-bold" id="total-views">-</div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="text-gray-500 text-sm mb-2">Monetag Status</div>
                    <div class="text-green-500 font-bold">Active</div>
                </div>
            </div>

            <!-- Articles List -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="px-6 py-4 text-sm font-bold text-gray-700">Title</th>
                            <th class="px-6 py-4 text-sm font-bold text-gray-700">Lang</th>
                            <th class="px-6 py-4 text-sm font-bold text-gray-700">Views</th>
                            <th class="px-6 py-4 text-sm font-bold text-gray-700">Status</th>
                        </tr>
                    </thead>
                    <tbody id="articles-table">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        async function loadDashboard() {
            const res = await fetch('/metadata.json');
            const pages = await res.json();

            document.getElementById('total-articles').innerText = pages.length;

            const table = document.getElementById('articles-table');
            let totalViews = 0;

            for (const page of pages) {
                // Fetch views for each page
                const statsRes = await fetch(`/api/stats?url=${encodeURIComponent(page.url)}`);
                const stats = await statsRes.json();
                const views = parseInt(stats.views || 0);
                totalViews += views;

                const row = document.createElement('tr');
                row.className = 'border-b last:border-0 hover:bg-gray-50';
                row.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900">${page.title}</div>
                        <div class="text-xs text-gray-500">${page.url}</div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded text-xs font-bold ${page.lang === 'jp' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}">
                            ${page.lang.toUpperCase()}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm font-mono">${views}</td>
                    <td class="px-6 py-4">
                        <span class="text-green-500 text-xs font-bold">Public</span>
                    </td>
                `;
                table.appendChild(row);
            }

            document.getElementById('total-views').innerText = totalViews;
        }

        loadDashboard();
    </script>
</body>
</html>
